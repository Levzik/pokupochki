<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED766" />
      <stop offset="100%" stop-color="#FDB927" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#EAA308" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Background soft circle (optional) -->
  <rect width="512" height="512" rx="128" fill="#FFFDF9" />
  
  <g transform="translate(64, 48)">
    <!-- Bag Handle -->
    <path d="M 128 170 C 128 85, 256 85, 256 170" fill="none" stroke="#FDB927" stroke-width="26" stroke-linecap="round" />
    
    <!-- Bag Body -->
    <path d="M 64 160 
             C 50 160, 40 172, 44 190 
             L 70 380 
             C 74 402, 94 416, 116 416 
             L 268 416 
             C 290 416, 310 402, 314 380 
             L 340 190 
             C 344 172, 334 160, 320 160 
             Z" 
          fill="url(#bagGrad)" 
          filter="url(#shadow)" />

    <!-- Cute Smile -->
    <path d="M 152 270 Q 192 315 232 270" fill="none" stroke="#684200" stroke-width="14" stroke-linecap="round" />
    
    <!-- Cute Eyes / Dimples -->
    <circle cx="140" cy="245" r="7" fill="#684200" />
    <circle cx="244" cy="245" r="7" fill="#684200" />
  </g>
</svg>
